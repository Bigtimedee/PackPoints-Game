name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Type check · Unit tests · Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: packpoints_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/packpoints_test
      SESSION_SECRET: ci-test-session-secret-at-least-32-chars-long
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install DejaVu (fonts-dejavu-core)
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core

      - name: Assert share fonts (SOCIAL_PNG_QA)
        run: npx tsx scripts/assert-share-fonts.ts

      - name: Type check
        run: npm run check

      - name: Push database schema
        run: npx drizzle-kit push

      - name: Unit tests
        run: npx vitest run

      - name: Build
        run: npm run build

      # SEO kit name-leak check against the live dealable pool. The token is a
      # GitHub Actions secret (never in this public repo). Without it the step
      # skips with a warning; server/tests/seoPages.test.ts (offline hashed
      # surname fixture) stays the hard gate.
      - name: SEO kit name-leak check (live pool)
        env:
          PACKPTS_QA_TOKEN: ${{ secrets.PACKPTS_QA_TOKEN }}
        run: |
          if [ -z "$PACKPTS_QA_TOKEN" ]; then
            echo "::warning::PACKPTS_QA_TOKEN secret is not available; skipping the live-pool SEO name-leak check. The offline surname fixture test still ran."
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/seo-pool"
          python3 scripts/seo-name-leak-check --kit docs/seo/content --pool-dir "$RUNNER_TEMP/seo-pool"
          # The rendered server HTML for every sitemap page (+ 404), not just the kit files.
          npx tsx scripts/render-seo-pages.ts "$RUNNER_TEMP/seo-html"
          python3 scripts/seo-name-leak-check --kit "$RUNNER_TEMP/seo-html" --pool-dir "$RUNNER_TEMP/seo-pool"

  e2e-stub:
    name: E2E (Playwright) — pending wiring
    runs-on: ubuntu-latest
    if: false
    steps:
      - run: echo "Playwright E2E not yet running in CI — see future prompt for live-server setup"
