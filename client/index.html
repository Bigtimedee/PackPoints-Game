<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />
    <title>PackPTS: Name the Player Sports Card Game | Earn Points</title>
    <meta name="description" content="Name the player on real sports cards with the name masked. Play the free Daily 5, explore classic sets, and earn points for eBay rebates." />
    <meta name="keywords" content="sports card trivia, PackPTS, card collecting game, sports cards quiz, name the player" />
    <link rel="canonical" href="https://packpts.com/" />

    <!-- PWA / iOS home-screen support -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0b0f16" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PackPTS" />

    <!-- Open Graph / Facebook. Homepage link preview v2 (Design, 2026-10-02). Every route
         without its own entry in server/lib/routeOg.ts SPA_ROUTE_META shows these tags.
         If client/public/og-image.png changes again, bump ?v= so X and iMessage refetch. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://packpts.com/" />
    <meta property="og:title" content="Can you name all 5? · PackPTS" />
    <meta property="og:description" content="A real trading card with the name masked. Pick the player from four choices. Daily 5 is the same five for everyone, new every day. Play free." />
    <meta property="og:image" content="https://packpts.com/og-image.png?v=2" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A masked trading card with a gold bar over the name, next to the question: Who's on the card?" />
    <meta property="og:site_name" content="PackPTS" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@PlayPackPTS" />
    <meta name="twitter:creator" content="@PlayPackPTS" />
    <meta name="twitter:title" content="Can you name all 5? · PackPTS" />
    <meta name="twitter:description" content="Real cards, names masked. Pick the player from four. Same Daily 5 for everyone. Play free." />
    <meta name="twitter:image" content="https://packpts.com/og-image.png?v=2" />

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "PackPTS",
      "url": "https://packpts.com",
      "description": "PackPTS is a free sports card game: name the player on a real card with the name masked. Earn points for eBay rebates.",
      "applicationCategory": "GameApplication",
      "operatingSystem": "Web",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "publisher": {
        "@type": "Organization",
        "name": "PackPTS",
        "url": "https://packpts.com"
      }
    }
    </script>

    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap" rel="stylesheet">
  </head>
  <body class="dark">
    <div id="root">
      <div id="initial-loader" style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background: hsl(220 20% 8%); color: hsl(220 10% 60%);">
        <div style="text-align: center;">
          <svg style="width: 48px; height: 48px; margin: 0 auto 16px; animation: spin 1s linear infinite;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12a9 9 0 1 1-6.219-8.56" stroke-linecap="round"/>
          </svg>
          <p style="font-family: system-ui, sans-serif; font-size: 14px;">Loading PackPTS...</p>
        </div>
      </div>
      <!--seo-content-->
    </div>
    <!--
      Static legal footer OUTSIDE #root: the React app never replaces it, so
      these links are present in the raw HTML on every page (including the
      homepage) for automated crawlers and platform reviewers (e.g. TikTok App
      Review), not only after client-side hydration. The app also renders its
      own footer links; this is the always-accessible fallback.
    -->
    <footer id="static-legal-footer" style="text-align:center; padding:16px; font-family: system-ui, sans-serif; font-size:13px; color: hsl(220 10% 55%); border-top:1px solid hsl(220 15% 18%);">
      <a href="/terms-of-service" style="color: hsl(220 10% 65%); margin:0 10px; text-decoration:underline;">Terms of Service</a>
      <a href="/privacy-policy" style="color: hsl(220 10% 65%); margin:0 10px; text-decoration:underline;">Privacy Policy</a>
      <a href="/dmca" style="color: hsl(220 10% 65%); margin:0 10px; text-decoration:underline;">Copyright and takedowns</a>
      <a href="mailto:support@packpts.com" style="color: hsl(220 10% 65%); margin:0 10px; text-decoration:underline;">Contact</a>
    </footer>
    <style>
      @keyframes spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
    </style>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
